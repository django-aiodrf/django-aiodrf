minimum_pre_commit_version: '4.0'
exclude: ^(\.local/|forks/|\.venv/|\.nox/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      # Use the installed project tools and pyproject.toml configuration.
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: public-docs-index
        name: Public documentation index
        entry: python -m tools.llms --check
        language: system
        files: (^llms\.txt$|\.md$)
        pass_filenames: false
