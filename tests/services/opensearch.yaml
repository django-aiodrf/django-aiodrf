# Disposable loopback-only server. Never use this security-disabled profile in production.
name: aiodrf-opensearch-test
services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.7.0}
    ports: ["127.0.0.1:17640:9200"]
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    tmpfs: ["/usr/share/opensearch/data:uid=1000,gid=1000,mode=0750"]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
