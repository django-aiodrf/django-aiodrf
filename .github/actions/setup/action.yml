name: Python and uv
description: Install the selected interpreter and the pinned development installer.
inputs:
  python:
    description: CPython version the nox session runs on, installed beside the tools' 3.14.
    default: '3.14'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # The last version listed is the default. The development tools run
        # on 3.14: their group includes orjson, which does not build for a
        # free-threaded interpreter.
        python-version: |
          ${{ inputs.python }}
          3.14
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.13'
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements/**/*.txt
          examples/**/pyproject.toml
    - name: Install development tools without a project lock
      shell: bash
      run: |
        uv venv --python 3.14
        uv pip install -e . --group dev
