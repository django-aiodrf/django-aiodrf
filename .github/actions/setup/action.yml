name: Python and uv
description: Install the selected interpreter and the pinned development installer.
inputs:
  python:
    description: CPython version to install.
    default: '3.14'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.13'
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements/**/*.txt
          examples/**/pyproject.toml
    - name: Install development tools without a project lock
      shell: bash
      run: |
        uv venv --python '${{ inputs.python }}'
        uv pip install -e . --group dev
