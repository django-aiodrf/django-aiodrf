name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      artifact-id: ${{ steps.ci.outputs.artifact-id }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Resolve the tag commit and its completed main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          python tools/release.py find-run --sha "$release_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: release-bundle
      - name: Verify source identity, version, changelog and checksums
        env:
          RELEASE_SHA: ${{ steps.ci.outputs.sha }}
        run: python tools/release.py verify --root release-bundle --sha "$RELEASE_SHA" --tag "$GITHUB_REF_NAME"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/django-aiodrf
    permissions:
      actions: read
      id-token: write
    steps:
      # No checkout or build in the job that can obtain a publishing token.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          path: release-bundle
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: release-bundle/dist/
          attestations: true

  archive:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
          path: release-bundle
      - name: Retain the evidence with the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          record = json.loads(Path('release-bundle/release-metadata/manifest.json').read_text())
          tag = os.environ['GITHUB_REF_NAME']
          if tag != 'v' + record['version']:
              raise ValueError('Release identity mismatch')
          Path('release-notes.md').write_text(record['notes'])
          found = subprocess.run(['gh', 'release', 'view', tag], check=False)
          if found.returncode:
              subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--title', tag,
                              '--notes-file', 'release-notes.md'], check=True)
          subprocess.run(['gh', 'release', 'upload', tag,
                          'release-bundle/release-metadata/manifest.json', '--clobber'], check=True)
          PY
