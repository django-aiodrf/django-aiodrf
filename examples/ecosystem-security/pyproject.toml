[project]
name = "aiodrf-example-ecosystem-security"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "django-aiodrf[filter,spectacular]", "django>=6.1,<6.2", "uvicorn>=0.30", "httpx>=0.27",
  "django-guardian", "djangorestframework-guardian", "rules",
  "django-simple-history", "django-auditlog", "django-oauth-toolkit",
  "djoser", "dj-rest-auth", "django-allauth[headless]", "django-cors-headers",
]

[tool.uv]
package = false

[tool.uv.sources]
django-aiodrf = { path = "../..", editable = true }

[dependency-groups]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
