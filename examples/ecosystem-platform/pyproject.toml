[project]
name = "aiodrf-example-ecosystem-platform"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["aiodrf-asgi-lifespan>=0.1,<0.2", "django-aiodrf","Django>=6.0,<6.1","uvicorn>=0.30","httpx>=0.27","django-health-check","django-idempotency-key","django-axes","django-structlog","django-log-request-id","django-debug-toolbar","django-silk","whitenoise","servestatic","drf-api-logger","apitally","wireup","django-prometheus","django-cachalot","django-cacheops","django-zeal","channels[daphne]","djangochannelsrestframework","django-typer>=4.1"]

[tool.uv]
package = false

[tool.uv.sources]
aiodrf-asgi-lifespan = { path = "../../forks/aiodrf-asgi-lifespan", editable = true }
django-aiodrf = {path = "../..", editable = true}

[dependency-groups]
test = ["pytest>=8","pytest-django>=4.9","pytest-asyncio>=0.24","asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # djangochannelsrestframework 1.3 calls asyncio.iscoroutinefunction,
  # deprecated in Python 3.14, on import and on every message.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:djangochannelsrestframework",
]

[tool.aiodrf-example]
settings-profiles = ["project.settings", "project.settings_logging", "project.settings_protection", "project.settings_debug", "project.settings_silk", "project.settings_prometheus", "project.settings_cache", "project.settings_wireup", "project.settings_whitenoise", "project.settings_whitenoise_async"]
