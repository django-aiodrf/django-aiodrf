[project]
name = "aiodrf-example-bookshop"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["django-aiodrf[filter,spectacular]", "uvicorn>=0.30", "httpx>=0.27", "asgi-lifespan>=2.1"]

[tool.uv]
package = false

[tool.uv.sources]
django-aiodrf = { path = "../..", editable = true }

[dependency-groups]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-asyncio>=0.24", "schemathesis>=4"]
