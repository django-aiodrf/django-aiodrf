[project]
name = "aiodrf-example-vendor-authentication"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["django-aiodrf","uvicorn>=0.30","httpx>=0.27","Django>=5.2,<5.3","djangorestframework-simplejwt>=5.5","django-rest-knox>=5","drf-auth-kit"]

[tool.uv]
package = false

[tool.uv.sources]
django-aiodrf = { path = "../..", editable = true }

[dependency-groups]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
